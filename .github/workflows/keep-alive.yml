name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */3 * *' # Runs every 3 days
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        run: |
          curl -X GET "https://${{ secrets.SUPABASE_REF }}.supabase.co/rest/v1/players?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
